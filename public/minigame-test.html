<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Treino de minigames · Expedição Aurora</title>
  <link rel="stylesheet" href="/minigame-test.css">
  <script src="/minigame-test.js" defer></script>
</head>
<body>
  <header>
    <h1>Treino de minigames</h1>
    <nav aria-label="Escolher minigame">
      <button type="button" data-game="market">Pedido do mercado</button>
      <button type="button" data-game="auction">Leilão</button>
      <button type="button" data-game="darkAuction">Leilão no Escuro</button>
      <button type="button" data-game="race">Corrida de sobrevivência</button>
      <button type="button" data-game="million">Show do Milhão - 999.000</button>
      <button type="button" data-game="pokemonQuiz">Quem é esse Pokémon?</button>
      <button type="button" data-game="wires">Cortes do Xurkitree</button>
      <button type="button" data-game="guess">Adivinha</button>
      <button type="button" data-game="magnetic">Campo Magnético</button>
      <button type="button" data-game="rhythm">Ritmo do Toxtricity</button>
      <button type="button" data-game="sorter">Esteira da Pokébola</button>
      <button type="button" data-game="elements">Três Cartas</button>
      <button type="button" data-game="twentyOne">21 da Equipe Rocket</button>
      <button type="button" data-game="claim">Par ou Roubo</button>
    </nav>
  </header>
  <main>
    <p id="practiceStatus" role="status">Escolha um minigame para treinar contra o Rival.</p>
    <iframe id="practiceGame" title="Minigame em teste" hidden></iframe>
  </main>
</body>
</html>
