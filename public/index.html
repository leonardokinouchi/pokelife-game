    <header>
      <div class="brand">
        <b class="brandmark" aria-hidden="true">✥</b> Expedição Aurora
      </div>
      <span id="topStatus">MULTIJOGADOR ONLINE</span>
    </header>
    <main id="shell">
      <section id="lobby">
        <div class="intro">
          <div class="kicker"><i></i> ARQUIPÉLAGO AURORA</div>
          <h1>Expedição<br /><em>Aurora</em><span>.</span></h1>
          <p>
            Trabalhe pela sua primeira Poké Bola, explore o arquipélago e
            desafie seus amigos pela Liga.
          </p>
          <div class="lobby-links">
            <a class="player-guide-link" href="/guia">Guia do treinador</a>
            <a class="player-guide-link" href="/test-minigames">Treinar minigames</a>
          </div>
          <div id="gate">
            <div class="tabs">
              <button class="tab active" data-mode="create">Criar sala</button
              ><button class="tab" data-mode="join">Entrar com código</button>
            </div>
            <form id="gateForm">
              <label
                >Nome de treinador<input
                  id="trainer"
                  maxlength="22"
                  autocomplete="nickname"
                  placeholder="Seu nome"
                  required /></label
              ><label id="codeRow" hidden
                >Código da sala<input
                  id="roomCode"
                  maxlength="5"
                  placeholder="Ex. A7K2P"
                  autocomplete="off" /></label
              ><fieldset id="gateAvatars" class="avatar-picker"><legend>Personagem</legend></fieldset>
              <button class="primary" id="gateSubmit">Criar minha sala</button>
            </form>
          </div>
          <div id="roomPanel"></div>
        </div>
        <figure class="plate">
          <div class="maphead">
            <div>
              <small>ATLAS DA EXPEDIÇÃO</small>
              <h2>Arquipélago Aurora</h2>
            </div>
            <span class="compass" aria-hidden="true">✥</span>
          </div>
          <div class="atlas">
            <img
              src="region.png"
              alt="Mapa ilustrado do Arquipélago Aurora com praias, florestas, montanhas e vulcões"
            /><span class="north">N<br />▲</span>
          </div>
          <figcaption>
            <span><b class="dot orange"></b>8 cidades</span
            ><span><b class="dot yellow"></b>6 vilas</span
            ><span><b class="dot green"></b>8 biomas</span>
          </figcaption>
        </figure>
      </section>
      <section id="game" hidden>
        <div id="map"></div>
        <div id="gameHead"></div>
        <aside id="partyRail" aria-label="Equipe de seis Pokémon"></aside>
        <nav id="dock"></nav>
        <div id="overlay" hidden>
          <div class="panel-toolbar"><button type="button" id="postSound" aria-haspopup="dialog" aria-label="Configurações de som">♪</button><button id="dismiss" aria-label="Fechar">×</button></div>
          <div id="content"></div>
        </div>
        <div id="personalOverlay" hidden>
          <div class="panel-toolbar"><button id="dismissPersonal" aria-label="Fechar painel">×</button></div>
          <div id="personalContent"></div>
        </div>
        <div id="arena" hidden></div>
        <section id="minigameScreen" aria-label="Minigame" hidden></section>
        <section id="duelTeamScreen" aria-label="Escalação para o duelo" hidden></section>
        <div id="roundDraw" role="status" hidden></div>
        <section id="finalScoreboard" aria-label="Classificação final" hidden></section>
      </section>
    </main>
    <div class="system">
      <button id="sound" type="button" aria-label="Configurações de som" aria-haspopup="dialog" title="Som">♪</button
      ><button id="fullscreen" aria-label="Tela cheia">⛶</button>
    </div>
    <dialog id="soundSettings" aria-labelledby="soundSettingsTitle">
      <h2 id="soundSettingsTitle">Som</h2>
      <label class="sound-mute"><input type="checkbox" id="soundMuted"> Silenciar todo o som</label>
      <label for="musicVolume">Música <output id="musicLevel" for="musicVolume"></output></label>
      <input type="range" id="musicVolume" min="0" max="100" step="1">
      <label for="effectsVolume">Efeitos <output id="effectsLevel" for="effectsVolume"></output></label>
      <input type="range" id="effectsVolume" min="0" max="100" step="1">
      <form method="dialog"><button type="submit">Fechar</button></form>
    </dialog>
    <dialog id="sessionEnded"><h2>Sala indisponível</h2><p>Esta sessão foi encerrada.</p><button data-action="home">Voltar ao lobby</button></dialog>
    <dialog id="roundCard" aria-labelledby="cardTitle"></dialog>
    <dialog id="moveLesson" aria-labelledby="moveLessonTitle"></dialog>
    <dialog id="pokemonDetails" aria-labelledby="pokemonDetailsTitle"></dialog>
    <dialog id="evolutionScene" aria-labelledby="evolutionTitle"></dialog>
    <div id="itemTooltip" role="tooltip" hidden><strong></strong><span></span></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="phaser.js" defer></script>
    <script src="world.js" defer></script>
    <script src="map.js" defer></script>
    <script src="storage.js" defer></script>
    <script src="results.js" defer></script>
    <script src="audio.js" defer></script>
    <script src="app.js" defer></script>
    <script src="fog.js" defer></script>
  </body>
</html>
